<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보젬 다시보기 - 관리자 센터</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            chzzk: '#00ffa3',
            'chzzk-dark': '#00cc82',
            'chzzk-hover': '#1affb0',
            'chzzk-bg': '#0a0e17',
            'chzzk-card': '#121824',
            'chzzk-header': '#0f1523',
            'chzzk-border': '#1e293b'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0a0e17; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .chzzk-glow { box-shadow: 0 0 15px rgba(0, 255, 163, 0.25); }
    .chzzk-text-glow { text-shadow: 0 0 10px rgba(0, 255, 163, 0.4); }
    .dragging { opacity: 0.4; border: 2px dashed #00ffa3 !important; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a0e17; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #00ffa3; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-chzzk selection:text-black">

  <!-- AUTH MODAL -->
  <div id="modal-auth" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-chzzk-card border border-chzzk-border p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <div class="w-14 h-14 rounded-2xl bg-chzzk text-black flex items-center justify-center text-2xl font-black mx-auto shadow-lg chzzk-glow">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="text-xl font-black text-slate-100 tracking-tight">관리자 인증</h2>
        <p class="text-xs text-slate-400">최고 관리자 대시보드 접근을 위해 비밀번호를 입력하세요.</p>
      </div>

      <form onsubmit="handleAdminLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">비밀번호</label>
          <div class="relative flex items-center">
            <input type="password" id="auth-password-input" placeholder="비밀번호 입력" required class="w-full bg-slate-950 border border-chzzk-border rounded-xl pl-4 pr-12 py-3 text-sm text-white focus:outline-none focus:border-chzzk">
            <button type="button" onclick="togglePassVisibility()" class="absolute right-3 text-slate-400 hover:text-chzzk text-base p-1.5 transition-colors">
              <i id="pass-toggle-icon" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="w-full bg-chzzk hover:bg-chzzk-hover text-black font-extrabold py-3 rounded-xl text-sm shadow-lg transition-all chzzk-glow flex items-center justify-center gap-2">
          <i class="fa-solid fa-key"></i> 관리자 대시보드 접속
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="dashboard-app" class="hidden flex-1 flex flex-col">
    <header class="bg-chzzk-header border-b border-chzzk-border sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-chzzk flex items-center justify-center font-black text-black text-xl shadow-lg chzzk-glow">
            <i class="fa-solid fa-sliders"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 id="header-site-title" class="text-lg font-black text-chzzk tracking-tight chzzk-text-glow">ADMIN DASHBOARD</h1>
              <span class="px-2 py-0.5 rounded text-[10px] font-extrabold bg-chzzk/20 text-chzzk border border-chzzk/40">REALTIME SYNC</span>
            </div>
            <p id="header-streamer-name" class="text-xs text-slate-400 font-medium">치지직 방송 아카이브 관리 시스템</p>
          </div>
        </div>

        <button onclick="handleLogout()" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 flex items-center gap-1.5 transition-colors">
          <i class="fa-solid fa-right-from-bracket text-red-400"></i> 로그아웃
        </button>
      </div>
    </header>

    <nav class="bg-slate-950 border-b border-chzzk-border">
      <div class="max-w-7xl mx-auto px-4 flex items-center gap-2 overflow-x-auto py-2 no-scrollbar">
        <button id="tab-videos" onclick="switchTab('videos')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all bg-chzzk text-black whitespace-nowrap">
          <i class="fa-solid fa-video mr-1.5"></i>다시보기 영상 관리
        </button>
        <button id="tab-categories" onclick="switchTab('categories')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white whitespace-nowrap">
          <i class="fa-solid fa-tags mr-1.5"></i>동적 카테고리 설정
        </button>
        <button id="tab-notices" onclick="switchTab('notices')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white whitespace-nowrap">
          <i class="fa-solid fa-bullhorn mr-1.5"></i>공지사항 & 배너
        </button>
        <button id="tab-requests" onclick="switchTab('requests')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white whitespace-nowrap">
          <i class="fa-solid fa-comments mr-1.5"></i>시청자 요청함
        </button>
        <button id="tab-settings" onclick="switchTab('settings')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white whitespace-nowrap">
          <i class="fa-solid fa-gear mr-1.5"></i>시스템 설정
        </button>
      </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">

      <!-- SEC 1: VIDEOS -->
      <section id="sec-videos" class="space-y-6">
        <div class="bg-chzzk-card border border-chzzk-border p-6 rounded-2xl shadow-xl space-y-4">
          <div class="flex items-center justify-between border-b border-chzzk-border pb-3">
            <h3 id="video-form-title" class="text-sm font-bold text-chzzk flex items-center gap-2">
              <i class="fa-solid fa-circle-plus"></i> 새 다시보기 영상 등록
            </h3>
            <button type="button" onclick="resetVideoForm()" class="text-xs text-slate-400 hover:text-slate-200">
              <i class="fa-solid fa-rotate-left mr-1"></i>양식 초기화
            </button>
          </div>

          <form id="video-form" onsubmit="handleVideoSubmit(event)" class="space-y-4">
            <input type="hidden" id="v-id">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">카테고리 선택</label>
                <select id="v-category" required class="w-full bg-slate-950 border border-chzzk-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-chzzk"></select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">방송 날짜</label>
                <input type="date" id="v-date" required class="w-full bg-slate-950 border border-chzzk-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-chzzk">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">상단 고정 여부</label>
                <label class="flex items-center gap-2 bg-slate-950 border border-chzzk-border rounded-xl px-3 py-2 text-xs text-slate-300 cursor-pointer h-[38px]">
                  <input type="checkbox" id="v-pinned" class="accent-emerald-400 rounded">
                  <span class="font-bold text-chzzk"><i class="fa-solid fa-thumbtack mr-1"></i>상단 고정</span>
                </label>
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">영상 제목</label>
              <input type="text" id="v-title" placeholder="방송 제목을 입력하세요" required class="w-full bg-slate-950 border border-chzzk-border rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-chzzk">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">유튜브 URL</label>
              <input type="url" id="v-url" placeholder="https://www.youtube.com/watch?v=..." required class="w-full bg-slate-950 border border-chzzk-border rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-chzzk">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">영상 설명 / 타임라인 기록</label>
              <textarea id="v-desc" rows="3" placeholder="00:00 오프닝" class="w-full bg-slate-950 border border-chzzk-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-chzzk leading-relaxed"></textarea>
            </div>
            <div class="flex justify-end gap-2">
              <button type="submit" id="btn-video-submit" class="px-6 py-2.5 rounded-xl text-xs font-extrabold bg-chzzk hover:bg-chzzk-hover text-black shadow-lg transition-all chzzk-glow flex items-center gap-1.5">
                <i class="fa-solid fa-floppy-disk"></i> 영상 실시간 저장
              </button>
            </div>
          </form>
        </div>

        <div class="space-y-4">
          <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
            <h3 class="text-sm font-bold text-slate-200 flex items-center gap-1.5">
              <i class="fa-solid fa-list-ol text-chzzk"></i> 등록된 영상 목록 (<span id="count-videos">0</span>)
              <span class="text-[11px] font-normal text-slate-400 ml-2">(💡 마우스로 끌어서 순서를 변경할 수 있습니다)</span>
            </h3>
            <input type="text" id="filter-video-search" oninput="renderVideoList()" placeholder="제목 검색..." class="bg-slate-950 border border-chzzk-border rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-chzzk min-w-[220px]">
          </div>
          <div id="video-list-container" class="space-y-2.5"></div>
        </div>
      </section>

      <!-- SEC 2: CATEGORIES -->
      <section id="sec-categories" class="hidden space-y-6 max-w-4xl">
        <div class="bg-chzzk-card border border-chzzk-border p-6 rounded-2xl shadow-xl space-y-5">
          <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2"><i class="fa-solid fa-tags text-chzzk"></i> 동적 카테고리 관리</h3>
          <form onsubmit="handleAddCategory(event)" class="flex gap-2 pt-2 border-t border-chzzk-border/60">
            <input type="text" id="cat-new-name" placeholder="새 카테고리 이름" required class="flex-1 bg-slate-950 border border-chzzk-border rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-chzzk">
            <button type="submit" class="bg-chzzk hover:bg-chzzk-hover text-black font-extrabold px-5 py-2.5 rounded-xl text-xs whitespace-nowrap">추가</button>
          </form>
          <div id="category-list-container" class="space-y-2 pt-4 border-t border-chzzk-border/60"></div>
        </div>
      </section>

      <!-- SEC 3: NOTICES -->
      <section id="sec-notices" class="hidden space-y-6 max-w-4xl">
        <div class="bg-chzzk-card border border-chzzk-border p-6 rounded-2xl shadow-xl space-y-4">
          <h3 class="text-sm font-bold text-chzzk flex items-center gap-2"><i class="fa-solid fa-bullhorn"></i> 새 공지사항 작성</h3>
          <form id="notice-form" onsubmit="handleNoticeSubmit(event)" class="space-y-4">
            <input type="hidden" id="n-id">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">작성 날짜</label>
                <input type="date" id="n-date" required class="w-full bg-slate-950 border border-chzzk-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-chzzk">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">상단 띠배너 게시</label>
                <label class="flex items-center gap-2 bg-slate-950 border border-chzzk-border rounded-xl px-3 py-2 text-xs text-slate-300 cursor-pointer h-[38px]">
                  <input type="checkbox" id="n-as-banner" class="accent-emerald-400 rounded">
                  <span class="font-bold text-chzzk">띠배너 게시</span>
                </label>
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">공지 제목</label>
              <input type="text" id="n-title" placeholder="공지 제목" required class="w-full bg-slate-950 border border-chzzk-border rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-chzzk">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">공지 본문</label>
              <textarea id="n-desc" rows="3" placeholder="내용 입력" required class="w-full bg-slate-950 border border-chzzk-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-chzzk"></textarea>
            </div>
            <div class="flex justify-end gap-2">
              <button type="submit" class="px-6 py-2 rounded-xl text-xs font-extrabold bg-chzzk hover:bg-chzzk-hover text-black shadow-lg">공지사항 저장</button>
            </div>
          </form>
        </div>
        <div id="notice-list-container" class="space-y-2.5"></div>
      </section>

      <!-- SEC 4: REQUESTS -->
      <section id="sec-requests" class="hidden space-y-6 max-w-4xl">
        <div class="bg-chzzk-card border border-chzzk-border p-6 rounded-2xl shadow-xl space-y-4">
          <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2"><i class="fa-solid fa-comments text-chzzk"></i> 시청자 요청함</h3>
          <div id="request-list-container" class="space-y-3"></div>
        </div>
      </section>

      <!-- SEC 5: SETTINGS -->
      <section id="sec-settings" class="hidden space-y-6 max-w-4xl">
        <div class="bg-chzzk-card border border-chzzk-border p-6 rounded-2xl shadow-xl space-y-4">
          <h3 class="text-sm font-bold text-chzzk flex items-center gap-2"><i class="fa-solid fa-sliders"></i> 브랜딩 설정</h3>
          <form onsubmit="handleSaveSettings(event)" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">사이트 상단 로고</label>
                <input type="text" id="set-site-title" required class="w-full bg-slate-950 border border-chzzk-border rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-chzzk">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">서브 타이틀</label>
                <input type="text" id="set-streamer-name" required class="w-full bg-slate-950 border border-chzzk-border rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-chzzk">
              </div>
            </div>
            <div class="flex justify-end">
              <button type="submit" class="bg-chzzk hover:bg-chzzk-hover text-black font-extrabold px-5 py-2 rounded-xl text-xs">설정 저장</button>
            </div>
          </form>
        </div>

        <div class="bg-chzzk-card border border-chzzk-border p-6 rounded-2xl shadow-xl space-y-4">
          <h3 class="text-sm font-bold text-chzzk flex items-center gap-2"><i class="fa-solid fa-key"></i> 비밀번호 변경</h3>
          <form onsubmit="handleChangePassword(event)" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">현재 비밀번호</label>
                <input type="password" id="pass-current" required class="w-full bg-slate-950 border border-chzzk-border rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-chzzk">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">새로운 비밀번호</label>
                <input type="password" id="pass-new" required class="w-full bg-slate-950 border border-chzzk-border rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-chzzk">
              </div>
            </div>
            <div class="flex justify-end">
              <button type="submit" class="bg-chzzk hover:bg-chzzk-hover text-black font-extrabold px-5 py-2 rounded-xl text-xs">비밀번호 변경</button>
            </div>
          </form>
        </div>
      </section>

    </main>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // 파이어베이스 설정값[cite: 5]
    const firebaseConfig = {
      apiKey: "AIzaSyDo0Cp5rBuDCnZJxDhPPOgzr0FF5IxY0f8",
      authDomain: "btjm-a4a4f.firebaseapp.com",
      projectId: "btjm-a4a4f",
      storageBucket: "btjm-a4a4f.firebasestorage.app",
      messagingSenderId: "704186478589",
      appId: "1:704186478589:web:71fe40c543ce3980ceb394"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let state = {
      videos: [],
      categories: ['저쳇', '게임', '음악', '합방', '기타'],
      notices: [],
      settings: { siteTitle: '보젬 다시보기', streamerName: '치지직 방송 아카이브' }
    };

    let requests = [];
    let currentTab = 'videos';

    // 데이터 실시간 동기화
    onSnapshot(doc(db, "archive", "mainData"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        state = {
          videos: data.videos || [],
          categories: data.categories || ['저쳇', '게임', '음악', '합방', '기타'],
          notices: data.notices || [],
          settings: data.settings || state.settings
        };
        initDashboard();
      } else {
        saveMainData(); // 문서 없으면 생성
      }
    });

    // 시청자 요청함 실시간 수신
    onSnapshot(collection(db, "requests"), (querySnap) => {
      requests = [];
      querySnap.forEach(docSnap => {
        requests.push({ id: docSnap.id, ...docSnap.data() });
      });
      requests.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      renderRequestList();
    });

    async function saveMainData() {
      try {
        await setDoc(doc(db, "archive", "mainData"), state);
      } catch (e) {
        alert('파이어베이스 저장 오류: ' + e.message);
      }
    }

    window.togglePassVisibility = function() {
      const input = document.getElementById('auth-password-input');
      const icon = document.getElementById('pass-toggle-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash text-chzzk';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    };

    window.handleAdminLogin = function(e) {
      e.preventDefault();
      const inputPass = document.getElementById('auth-password-input').value;
      const currentPass = localStorage.getItem('STREAM_ADMIN_PASS_V1') || 'admin1234';

      if (inputPass === currentPass) {
        document.getElementById('modal-auth').classList.add('hidden');
        document.getElementById('dashboard-app').classList.remove('hidden');
        initDashboard();
      } else {
        alert('비밀번호가 틀렸습니다.');
      }
    };

    window.handleLogout = function() {
      document.getElementById('auth-password-input').value = '';
      document.getElementById('dashboard-app').classList.add('hidden');
      document.getElementById('modal-auth').classList.remove('hidden');
    };

    function initDashboard() {
      document.getElementById('header-site-title').textContent = state.settings.siteTitle;
      document.getElementById('header-streamer-name').textContent = state.settings.streamerName;
      populateCategorySelect();
      renderVideoList();
      renderCategoryList();
      renderNoticeList();
      renderRequestList();
      loadSettingsForm();
    }

    window.switchTab = function(tab) {
      currentTab = tab;
      ['videos', 'categories', 'notices', 'requests', 'settings'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        const sec = document.getElementById(`sec-${t}`);
        if(t === tab) {
          btn.className = 'px-4 py-2 rounded-xl text-xs font-bold transition-all bg-chzzk text-black whitespace-nowrap shadow';
          sec.classList.remove('hidden');
        } else {
          btn.className = 'px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white whitespace-nowrap';
          sec.classList.add('hidden');
        }
      });
    };

    function populateCategorySelect() {
      const select = document.getElementById('v-category');
      select.innerHTML = state.categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    window.handleVideoSubmit = async function(e) {
      e.preventDefault();
      const id = document.getElementById('v-id').value;
      const category = document.getElementById('v-category').value;
      const date = document.getElementById('v-date').value;
      const pinned = document.getElementById('v-pinned').checked;
      const title = document.getElementById('v-title').value.trim();
      const url = document.getElementById('v-url').value.trim();
      const desc = document.getElementById('v-desc').value.trim();

      if (id) {
        const idx = state.videos.findIndex(v => v.id === id);
        if (idx !== -1) state.videos[idx] = { ...state.videos[idx], category, date, pinned, title, url, desc };
      } else {
        state.videos.unshift({ id: 'v_' + Date.now(), category, date, pinned, title, url, desc });
      }

      await saveMainData();
      resetVideoForm();
      alert('실시간 동기화 완료!');
    };

    window.resetVideoForm = function() {
      document.getElementById('video-form').reset();
      document.getElementById('v-id').value = '';
      document.getElementById('v-date').value = new Date().toISOString().split('T')[0];
    };

    window.editVideo = function(id) {
      const video = state.videos.find(v => v.id === id);
      if(!video) return;
      document.getElementById('v-id').value = video.id;
      document.getElementById('v-category').value = video.category;
      document.getElementById('v-date').value = video.date;
      document.getElementById('v-pinned').checked = !!video.pinned;
      document.getElementById('v-title').value = video.title;
      document.getElementById('v-url').value = video.url;
      document.getElementById('v-desc').value = video.desc || '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteVideo = async function(id) {
      if(!confirm('해당 영상을 정말 삭제하시겠습니까?')) return;
      state.videos = state.videos.filter(v => v.id !== id);
      await saveMainData();
    };

    /* Drag & Drop */
    let draggedIndex = null;
    window.renderVideoList = function() {
      const container = document.getElementById('video-list-container');
      const search = (document.getElementById('filter-video-search')?.value || '').trim().toLowerCase();
      let list = state.videos;

      document.getElementById('count-videos').textContent = list.length;
      if (search) list = list.filter(v => v.title.toLowerCase().includes(search));

      if (list.length === 0) {
        container.innerHTML = `<div class="bg-chzzk-card p-6 rounded-xl text-center text-slate-500 text-xs border border-chzzk-border">등록된 영상이 없습니다.</div>`;
        return;
      }

      container.innerHTML = list.map((v, idx) => `
        <div draggable="true" ondragstart="onDragStart(event, ${idx})" ondragover="onDragOver(event)" ondrop="onDrop(event, ${idx})" ondragend="onDragEnd(event)"
             class="bg-chzzk-card border border-chzzk-border p-3.5 rounded-xl flex items-center justify-between gap-3 cursor-grab active:cursor-grabbing hover:border-chzzk/50">
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <i class="fa-solid fa-grip-vertical text-slate-500"></i>
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-chzzk/10 text-chzzk border border-chzzk/30">[${v.category}]</span>
                ${v.pinned ? `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/30">고정</span>` : ''}
                <span class="text-xs text-slate-500">${v.date}</span>
              </div>
              <h4 class="font-bold text-xs sm:text-sm text-slate-100 truncate mt-1">${v.title}</h4>
            </div>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="editVideo('${v.id}')" class="px-2.5 py-1.5 rounded-lg text-xs bg-slate-800 text-slate-200 border border-slate-700"><i class="fa-solid fa-pen"></i></button>
            <button onclick="deleteVideo('${v.id}')" class="px-2.5 py-1.5 rounded-lg text-xs bg-red-950/40 text-red-300 border border-red-800/60"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    };

    window.onDragStart = function(e, index) { draggedIndex = index; e.target.classList.add('dragging'); };
    window.onDragOver = function(e) { e.preventDefault(); };
    window.onDrop = async function(e, targetIndex) {
      e.preventDefault();
      if (draggedIndex === null || draggedIndex === targetIndex) return;
      const item = state.videos.splice(draggedIndex, 1)[0];
      state.videos.splice(targetIndex, 0, item);
      await saveMainData();
    };
    window.onDragEnd = function(e) { draggedIndex = null; e.target.classList.remove('dragging'); };

    /* Categories */
    window.handleAddCategory = async function(e) {
      e.preventDefault();
      const input = document.getElementById('cat-new-name');
      const name = input.value.trim();
      if (state.categories.includes(name)) return alert('중복된 카테고리입니다.');
      state.categories.push(name);
      await saveMainData();
      input.value = '';
    };

    function renderCategoryList() {
      const container = document.getElementById('category-list-container');
      container.innerHTML = state.categories.map((cat, idx) => `
        <div class="bg-slate-950 border border-chzzk-border p-3 rounded-xl flex items-center justify-between">
          <span class="font-bold text-xs sm:text-sm text-slate-200">${cat}</span>
          <button onclick="deleteCategory(${idx})" class="px-2.5 py-1 rounded bg-red-950/40 text-red-300 text-xs border border-red-800/60">삭제</button>
        </div>
      `).join('');
    }

    window.deleteCategory = async function(idx) {
      if (state.categories.length <= 1) return alert('최소 1개 이상 유지되어야 합니다.');
      state.categories.splice(idx, 1);
      await saveMainData();
    };

    /* Notices */
    window.handleNoticeSubmit = async function(e) {
      e.preventDefault();
      const date = document.getElementById('n-date').value;
      const asBanner = document.getElementById('n-as-banner').checked;
      const title = document.getElementById('n-title').value.trim();
      const desc = document.getElementById('n-desc').value.trim();

      if (asBanner) state.notices.forEach(n => n.asBanner = false);
      state.notices.unshift({ id: 'n_' + Date.now(), date, asBanner, title, desc });
      await saveMainData();
      document.getElementById('notice-form').reset();
    };

    function renderNoticeList() {
      const container = document.getElementById('notice-list-container');
      container.innerHTML = state.notices.map(n => `
        <div class="bg-chzzk-card border border-chzzk-border p-4 rounded-xl flex items-center justify-between">
          <div>
            <span class="text-xs text-slate-400">${n.date}</span>
            <h4 class="font-bold text-xs sm:text-sm text-slate-100">${n.title}</h4>
          </div>
          <button onclick="deleteNotice('${n.id}')" class="px-3 py-1.5 rounded-lg text-xs bg-red-950/40 text-red-300 border border-red-800/60">삭제</button>
        </div>
      `).join('');
    }

    window.deleteNotice = async function(id) {
      state.notices = state.notices.filter(n => n.id !== id);
      await saveMainData();
    };

    /* Requests */
    function renderRequestList() {
      const container = document.getElementById('request-list-container');
      if (requests.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">등록된 요청이 없습니다.</div>`;
        return;
      }
      container.innerHTML = requests.map(r => `
        <div class="bg-slate-950 border border-chzzk-border p-4 rounded-xl space-y-2">
          <div class="flex items-center justify-between text-xs border-b border-chzzk-border/40 pb-2">
            <div>
              <span class="font-extrabold text-chzzk">[${r.type}]</span>
              <span class="font-bold text-slate-200 ml-1">${r.author}</span>
              <span class="text-slate-500 text-[11px] ml-1">(${r.date})</span>
            </div>
            <button onclick="deleteRequest('${r.id}')" class="text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button>
          </div>
          <p class="text-xs text-slate-300 whitespace-pre-line leading-relaxed">${r.content}</p>
        </div>
      `).join('');
    }

    window.deleteRequest = async function(id) {
      if(!confirm('삭제하시겠습니까?')) return;
      await deleteDoc(doc(db, "requests", id));
    };

    /* Settings */
    function loadSettingsForm() {
      document.getElementById('set-site-title').value = state.settings.siteTitle;
      document.getElementById('set-streamer-name').value = state.settings.streamerName;
    }

    window.handleSaveSettings = async function(e) {
      e.preventDefault();
      state.settings.siteTitle = document.getElementById('set-site-title').value.trim();
      state.settings.streamerName = document.getElementById('set-streamer-name').value.trim();
      await saveMainData();
      alert('설정이 실시간 적용되었습니다.');
    };

    window.handleChangePassword = function(e) {
      e.preventDefault();
      const curr = document.getElementById('pass-current').value;
      const next = document.getElementById('pass-new').value.trim();
      const actualCurr = localStorage.getItem('STREAM_ADMIN_PASS_V1') || 'admin1234';

      if (curr !== actualCurr) return alert('현재 비밀번호가 틀렸습니다.');
      localStorage.setItem('STREAM_ADMIN_PASS_V1', next);
      alert('비밀번호가 변경되었습니다!');
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>치지직 방송 다시보기 아카이브</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            chzzk: '#00ffa3',
            'chzzk-dark': '#00cc82',
            'chzzk-hover': '#1affb0',
            'chzzk-bg': '#0a0e17',
            'chzzk-card': '#121824',
            'chzzk-header': '#0f1523',
            'chzzk-border': '#1e293b'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0a0e17; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .chzzk-glow { box-shadow: 0 0 15px rgba(0, 255, 163, 0.25); }
    .chzzk-text-glow { text-shadow: 0 0 10px rgba(0, 255, 163, 0.4); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a0e17; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #00ffa3; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-chzzk selection:text-black">

  <!-- ==================== TOP BANNER (관리자 설정) ==================== -->
  <div id="top-banner" class="hidden bg-chzzk text-black font-bold text-xs py-2 px-4 text-center relative z-50 shadow-md flex items-center justify-center gap-2">
    <i class="fa-solid fa-bullhorn text-sm"></i>
    <span id="top-banner-text"></span>
  </div>

  <!-- ==================== HEADER ==================== -->
  <header class="bg-chzzk-header border-b border-chzzk-border sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      
      <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('videos')">
        <div class="w-10 h-10 rounded-xl bg-chzzk flex items-center justify-center font-black text-black text-xl shadow-lg chzzk-glow">
          <i class="fa-solid fa-play"></i>
        </div>
        <div>
          <h1 id="site-title-display" class="text-xl font-black text-chzzk tracking-tight chzzk-text-glow">REPLAY ARCHIVE</h1>
          <p id="streamer-name-display" class="text-xs text-slate-400 font-medium">치지직 방송 다시보기 센터</p>
        </div>
      </div>

      <!-- MAIN TABS -->
      <div class="flex bg-slate-950 p-1 rounded-xl border border-chzzk-border">
        <button id="tab-videos" onclick="switchTab('videos')" class="px-5 py-2 rounded-lg text-xs font-extrabold transition-all bg-chzzk text-black shadow">
          <i class="fa-solid fa-film mr-1.5"></i>다시보기
        </button>
        <button id="tab-notices" onclick="switchTab('notices')" class="px-5 py-2 rounded-lg text-xs font-extrabold transition-all text-slate-400 hover:text-white">
          <i class="fa-solid fa-bullhorn mr-1.5"></i>공지사항
        </button>
        <button id="tab-requests" onclick="switchTab('requests')" class="px-5 py-2 rounded-lg text-xs font-extrabold transition-all text-slate-400 hover:text-white">
          <i class="fa-solid fa-comments mr-1.5"></i>시청자 요청함
        </button>
      </div>

    </div>
  </header>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">

    <!-- TAB 1: REPLAY VIDEOS -->
    <section id="sec-videos" class="space-y-6">
      
      <!-- Category Filter Bar -->
      <div class="flex flex-wrap items-center gap-2 pb-3 border-b border-chzzk-border overflow-x-auto" id="category-filter-bar">
        <!-- Dynamic Categories populate here -->
      </div>

      <!-- Search & Count -->
      <div class="flex items-center justify-between gap-4">
        <p class="text-xs text-slate-400 font-medium">총 <span id="count-display" class="text-chzzk font-bold">0</span>개의 영상</p>
        <div class="relative max-w-xs w-full">
          <input type="text" id="search-input" oninput="renderVideos()" placeholder="영상 제목 검색..." class="w-full bg-chzzk-card border border-chzzk-border rounded-xl pl-9 pr-4 py-2 text-xs text-white focus:outline-none focus:border-chzzk">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-500"></i>
        </div>
      </div>

      <!-- Video Grid -->
      <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
      
      <div id="no-videos" class="hidden text-center py-20 text-slate-500">
        <i class="fa-solid fa-video-slash text-4xl mb-3"></i>
        <p class="text-sm">등록되었거나 검색 조건에 맞는 다시보기 영상이 없습니다.</p>
      </div>
    </section>

    <!-- TAB 2: NOTICES -->
    <section id="sec-notices" class="hidden max-w-4xl mx-auto space-y-4">
      <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2 mb-4">
        <i class="fa-solid fa-bullhorn text-chzzk"></i> 방송 공지사항
      </h2>
      <div id="notice-list" class="space-y-4"></div>
    </section>

    <!-- TAB 3: VIEWER REQUESTS (READ & WRITE ONLY) -->
    <section id="sec-requests" class="hidden max-w-4xl mx-auto space-y-6">
      
      <!-- Submit Request Form -->
      <div class="bg-chzzk-card p-6 rounded-2xl border border-chzzk-border shadow-xl space-y-4">
        <div>
          <h2 class="text-md font-bold text-slate-100 flex items-center gap-2">
            <i class="fa-solid fa-paper-plane text-chzzk"></i> 영상 요청 및 삭제/수정 피드백 작성
          </h2>
          <p class="text-xs text-slate-400 mt-1">다시보고 싶은 과거 방송 요청이나 삭제가 필요한 타임라인 피드백을 남겨주세요.</p>
        </div>

        <form onsubmit="handleRequestSubmit(event)" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">작성자 닉네임</label>
              <input type="text" id="req-author" placeholder="닉네임 입력" required class="w-full bg-slate-950 border border-chzzk-border rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-chzzk">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">요청 유형</label>
              <select id="req-type" class="w-full bg-slate-950 border border-chzzk-border rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-chzzk">
                <option value="🎬 [영상요청]">🎬 [영상요청] 다시보고 싶은 방송이 있어요</option>
                <option value="⚠️ [수정/삭제]">⚠️ [수정/삭제] 특정 구간 수정/삭제 요청</option>
                <option value="💡 [의견/피드백]">💡 [의견/피드백] 기타 방송/아카이브 의견</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">내용 작성</label>
            <textarea id="req-content" rows="3" placeholder="내용을 자세히 작성해주세요. (유튜브 링크나 타임라인 첨부 가능)" required class="w-full bg-slate-950 border border-chzzk-border rounded-xl p-4 text-xs text-white focus:outline-none focus:border-chzzk leading-relaxed"></textarea>
          </div>

          <div class="flex justify-end">
            <button type="submit" class="bg-chzzk hover:bg-chzzk-hover text-black font-extrabold px-6 py-2.5 rounded-xl text-xs transition-all shadow-lg chzzk-glow">
              <i class="fa-solid fa-paper-plane mr-1.5"></i> 작성 완료
            </button>
          </div>
        </form>
      </div>

      <!-- Request List -->
      <div class="space-y-4">
        <h3 class="text-sm font-bold text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-list text-chzzk"></i> 시청자 피드백 목록
        </h3>
        <div id="request-list" class="space-y-3"></div>
      </div>

    </section>

  </main>

  <!-- ==================== VIDEO PLAYER MODAL ==================== -->
  <div id="video-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-chzzk-card border border-chzzk-border w-full max-w-4xl rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
      
      <div class="p-4 border-b border-chzzk-border flex items-center justify-between">
        <div class="flex items-center gap-2 min-w-0">
          <span id="modal-tag" class="px-2.5 py-0.5 rounded text-[11px] font-bold bg-chzzk/10 text-chzzk border border-chzzk/30 shrink-0"></span>
          <h3 id="modal-title" class="font-bold text-slate-100 text-sm sm:text-base truncate"></h3>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1 text-xl transition-colors">&times;</button>
      </div>

      <div class="relative w-full aspect-video bg-black">
        <iframe id="modal-iframe" class="w-full h-full border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>

      <div class="p-4 bg-slate-950 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-t border-chzzk-border">
        <div class="text-xs text-slate-400 space-y-1">
          <p id="modal-date" class="font-bold text-slate-300"></p>
          <p id="modal-desc" class="whitespace-pre-line leading-relaxed max-h-24 overflow-y-auto pr-2"></p>
        </div>
        <a id="modal-external-link" href="#" target="_blank" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-xs text-slate-200 transition-all flex items-center gap-2 whitespace-nowrap border border-chzzk-border shrink-0">
          <i class="fa-brands fa-youtube text-red-500"></i> YouTube에서 열기
        </a>
      </div>

    </div>
  </div>

  <!-- ==================== JAVASCRIPT LOGIC ==================== -->
  <script>
    /* STORAGE KEYS (Synced with Admin Dashboard) */
    const STORAGE_KEYS = {
      VIDEOS: 'STREAM_REPLAY_DATA_V2',
      CATEGORIES: 'STREAM_CATEGORIES_V1',
      NOTICES: 'STREAM_NOTICES_V1',
      REQUESTS: 'STREAM_REQUEST_DATA_V1',
      SETTINGS: 'STREAM_SITE_SETTINGS_V1'
    };

    const DEFAULT_CATEGORIES = ['저쳇', '게임', '음악', '합방', '기타'];
    const DEFAULT_SETTINGS = {
      siteTitle: 'REPLAY ARCHIVE',
      streamerName: '치지직 방송 다시보기 센터'
    };

    let currentCategory = 'ALL';

    function getStoredData(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function extractYoutubeId(url) {
      if(!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    /* Tab Switcher */
    function switchTab(tab) {
      ['videos', 'notices', 'requests'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        const sec = document.getElementById(`sec-${t}`);
        if(t === tab) {
          btn.className = 'px-5 py-2 rounded-lg text-xs font-extrabold transition-all bg-chzzk text-black shadow';
          sec.classList.remove('hidden');
        } else {
          btn.className = 'px-5 py-2 rounded-lg text-xs font-extrabold transition-all text-slate-400 hover:text-white';
          sec.classList.add('hidden');
        }
      });

      if (tab === 'requests') renderRequests();
    }

    /* Apply Branding & Banner */
    function applyBranding() {
      const settings = getStoredData(STORAGE_KEYS.SETTINGS, DEFAULT_SETTINGS);
      document.getElementById('site-title-display').textContent = settings.siteTitle || DEFAULT_SETTINGS.siteTitle;
      document.getElementById('streamer-name-display').textContent = settings.streamerName || DEFAULT_SETTINGS.streamerName;

      // Top Banner Notice Check
      const notices = getStoredData(STORAGE_KEYS.NOTICES, []);
      const bannerNotice = notices.find(n => n.asBanner);
      if (bannerNotice) {
        document.getElementById('top-banner-text').textContent = bannerNotice.title;
        document.getElementById('top-banner').classList.remove('hidden');
      } else {
        document.getElementById('top-banner').classList.add('hidden');
      }
    }

    /* Render Dynamic Categories */
    function renderCategoryFilter() {
      const categories = getStoredData(STORAGE_KEYS.CATEGORIES, DEFAULT_CATEGORIES);
      const container = document.getElementById('category-filter-bar');

      let html = `<span class="text-xs font-bold text-slate-400 mr-2 flex items-center gap-1"><i class="fa-solid fa-filter text-chzzk"></i> 분류:</span>`;
      
      html += `<button onclick="filterCategory('ALL')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all ${currentCategory === 'ALL' ? 'bg-chzzk text-black' : 'bg-slate-900 text-slate-300 hover:bg-slate-800 border border-chzzk-border'}">전체보기</button>`;

      categories.forEach(cat => {
        const active = currentCategory === cat;
        html += `<button onclick="filterCategory('${cat}')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all ${active ? 'bg-chzzk text-black' : 'bg-slate-900 text-slate-300 hover:bg-slate-800 border border-chzzk-border'}">${cat}</button>`;
      });

      container.innerHTML = html;
    }

    function filterCategory(cat) {
      currentCategory = cat;
      renderCategoryFilter();
      renderVideos();
    }

    /* Render Videos */
    function renderVideos() {
      const grid = document.getElementById('video-grid');
      const noVideos = document.getElementById('no-videos');
      const search = document.getElementById('search-input').value.trim().toLowerCase();
      
      let videos = getStoredData(STORAGE_KEYS.VIDEOS, []);

      // Category Filter
      if (currentCategory !== 'ALL') {
        videos = videos.filter(v => v.category === currentCategory);
      }

      // Search Filter
      if (search) {
        videos = videos.filter(v => v.title.toLowerCase().includes(search) || v.category.toLowerCase().includes(search));
      }

      document.getElementById('count-display').textContent = videos.length;

      if (videos.length === 0) {
        grid.innerHTML = '';
        noVideos.classList.remove('hidden');
        return;
      }

      noVideos.classList.add('hidden');

      grid.innerHTML = videos.map(v => {
        const videoId = extractYoutubeId(v.url);
        const thumbUrl = videoId ? `https://img.youtube.com/vi/${videoId}/mqdefault.jpg` : 'https://via.placeholder.com/400x225/121824/64748b?text=No+Thumbnail';

        return `
          <div onclick="openModal('${v.id}')" class="bg-chzzk-card border border-chzzk-border rounded-2xl overflow-hidden hover:border-chzzk/60 hover:shadow-xl transition-all duration-300 cursor-pointer group flex flex-col">
            <div class="relative aspect-video bg-slate-950 overflow-hidden">
              <img src="${thumbUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="thumbnail">
              <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors flex items-center justify-center">
                <div class="w-12 h-12 rounded-full bg-chzzk text-black flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform font-black">
                  <i class="fa-solid fa-play ml-0.5"></i>
                </div>
              </div>
              <span class="absolute top-3 left-3 bg-black/80 backdrop-blur-md border border-chzzk/30 text-chzzk text-[10px] font-extrabold px-2.5 py-1 rounded-md">
                [${v.category}]
              </span>
              ${v.pinned ? `<span class="absolute top-3 right-3 bg-amber-500/90 text-black text-[10px] font-extrabold px-2 py-0.5 rounded"><i class="fa-solid fa-thumbtack mr-0.5"></i>고정</span>` : ''}
            </div>
            <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
              <h3 class="font-bold text-slate-100 group-hover:text-chzzk transition-colors line-clamp-2 text-xs sm:text-sm leading-snug">${v.title}</h3>
              <p class="text-[11px] text-slate-400 flex items-center gap-1.5"><i class="fa-regular fa-calendar"></i> ${v.date}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    /* Render Notices */
    function renderNotices() {
      const container = document.getElementById('notice-list');
      const notices = getStoredData(STORAGE_KEYS.NOTICES, []);

      if (notices.length === 0) {
        container.innerHTML = `<div class="bg-chzzk-card p-10 rounded-2xl text-center text-slate-500 text-xs border border-chzzk-border">등록된 공지사항이 없습니다.</div>`;
        return;
      }

      container.innerHTML = notices.map(n => `
        <div class="bg-chzzk-card border border-chzzk-border p-5 rounded-2xl space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-extrabold text-chzzk bg-chzzk/10 px-2.5 py-1 rounded-md border border-chzzk/30">공지</span>
            <span class="text-xs text-slate-500">${n.date}</span>
          </div>
          <h3 class="text-base font-bold text-slate-100">${n.title}</h3>
          <p class="text-xs text-slate-300 whitespace-pre-line leading-relaxed">${n.desc}</p>
        </div>
      `).join('');
    }

    /* Request Handling */
    function handleRequestSubmit(e) {
      e.preventDefault();
      const author = document.getElementById('req-author').value.trim();
      const type = document.getElementById('req-type').value;
      const content = document.getElementById('req-content').value.trim();

      const requests = getStoredData(STORAGE_KEYS.REQUESTS, []);
      const newReq = {
        id: 'req_' + Date.now(),
        author,
        type,
        content,
        status: '대기중',
        date: new Date().toISOString().split('T')[0]
      };

      requests.unshift(newReq);
      localStorage.setItem(STORAGE_KEYS.REQUESTS, JSON.stringify(requests));

      alert('성공적으로 피드백/요청글이 작성되었습니다!');
      document.getElementById('req-author').value = '';
      document.getElementById('req-content').value = '';
      renderRequests();
    }

    function renderRequests() {
      const container = document.getElementById('request-list');
      const requests = getStoredData(STORAGE_KEYS.REQUESTS, []);

      if (requests.length === 0) {
        container.innerHTML = `<div class="bg-chzzk-card p-8 rounded-xl text-center text-slate-500 text-xs border border-chzzk-border">작성된 피드백글이 없습니다. 첫 의견을 작성해보세요!</div>`;
        return;
      }

      container.innerHTML = requests.map(req => {
        let statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30">⏳ 대기중</span>`;
        if (req.status === '처리완료') statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-chzzk/10 text-chzzk border border-chzzk/30">✅ 처리완료</span>`;
        if (req.status === '거절됨') statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-red-500/10 text-red-400 border border-red-500/30">❌ 거절됨</span>`;

        return `
          <div class="bg-chzzk-card border border-chzzk-border p-4 rounded-xl space-y-2">
            <div class="flex items-center justify-between text-xs">
              <div class="flex items-center gap-2">
                <span class="font-extrabold text-chzzk">${req.type}</span>
                <span class="font-bold text-slate-200">${req.author}</span>
                ${statusBadge}
              </div>
              <span class="text-slate-500 text-[11px]">${req.date}</span>
            </div>
            <p class="text-xs text-slate-300 whitespace-pre-line leading-relaxed">${req.content}</p>
          </div>
        `;
      }).join('');
    }

    /* Modal Player */
    function openModal(id) {
      const videos = getStoredData(STORAGE_KEYS.VIDEOS, []);
      const v = videos.find(item => item.id === id);
      if(!v) return;

      const videoId = extractYoutubeId(v.url);
      const embedUrl = videoId ? `https://www.youtube.com/embed/${videoId}?autoplay=1&origin=${encodeURIComponent(window.location.origin)}&rel=0` : '';

      document.getElementById('modal-tag').textContent = `[${v.category}]`;
      document.getElementById('modal-title').textContent = v.title;
      document.getElementById('modal-date').textContent = `방송일: ${v.date}`;
      document.getElementById('modal-desc').textContent = v.desc || '등록된 타임라인/설명이 없습니다.';
      document.getElementById('modal-iframe').src = embedUrl;
      document.getElementById('modal-external-link').href = v.url || '#';

      document.getElementById('video-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('video-modal').classList.add('hidden');
      document.getElementById('modal-iframe').src = '';
    }

    /* Init */
    window.onload = function() {
      applyBranding();
      renderCategoryFilter();
      renderVideos();
      renderNotices();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보젬 다시보기</title>
  <meta property="og:title" content="보젬 다시보기">
<meta property="og:description" content="보젬 다시보기 모음">
<meta property="og:image" content="https://0821kmw.github.io/btjm/b.jpg>
<meta property="og:url" content="https://0821kmw.github.io/btjm/">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            chzzk: '#00ffa3',
            'chzzk-dark': '#00cc82',
            'chzzk-hover': '#1affb0',
            'chzzk-bg': '#0a0e17',
            'chzzk-card': '#121824',
            'chzzk-header': '#0f1523',
            'chzzk-border': '#1e293b'
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0a0e17; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .chzzk-glow { box-shadow: 0 0 15px rgba(0, 255, 163, 0.25); }
    .chzzk-text-glow { text-shadow: 0 0 10px rgba(0, 255, 163, 0.4); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a0e17; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #00ffa3; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-chzzk selection:text-black">

  <!-- Banner Notice -->
  <div id="top-banner" class="hidden bg-chzzk text-black py-2 px-4 text-xs font-bold text-center relative">
    <span id="top-banner-text"></span>
    <button onclick="closeBanner()" class="absolute right-3 top-1/2 -translate-y-1/2 text-black/70 hover:text-black font-black text-sm">✕</button>
  </div>

  <!-- Header -->
  <header class="bg-chzzk-header border-b border-chzzk-border sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-chzzk flex items-center justify-center font-black text-black text-xl shadow-lg chzzk-glow">
          <i class="fa-solid fa-play"></i>
        </div>
        <div>
          <h1 id="site-title" class="text-lg font-black text-chzzk tracking-tight chzzk-text-glow">REPLAY ARCHIVE</h1>
          <p id="streamer-name" class="text-xs text-slate-400 font-medium">치지직 방송 다시보기 아카이브</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openModal('request')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 flex items-center gap-1.5 transition-colors">
          <i class="fa-solid fa-paper-plane text-chzzk"></i> 시청자 요청함
        </button>
        <button onclick="openModal('notice')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 flex items-center gap-1.5 transition-colors">
          <i class="fa-solid fa-bullhorn text-amber-400"></i> 공지사항
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation / Categories -->
  <nav class="bg-slate-950 border-b border-chzzk-border sticky top-[65px] z-30">
    <div class="max-w-7xl mx-auto px-4 flex items-center gap-2 overflow-x-auto py-2.5 no-scrollbar" id="category-bar"></div>
  </nav>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
    
    <!-- Search Bar & Filters -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 bg-chzzk-card border border-chzzk-border p-3.5 rounded-2xl shadow-lg">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
        <input type="text" id="search-input" oninput="renderVideos()" placeholder="다시보기 제목 또는 카테고리 검색..." class="w-full bg-slate-950 border border-chzzk-border rounded-xl pl-9 pr-4 py-2 text-xs text-slate-200 focus:outline-none focus:border-chzzk">
      </div>
      <div class="flex items-center gap-2 text-xs text-slate-400 justify-end">
        <span>총 <strong id="video-count" class="text-chzzk">0</strong>개 다시보기</span>
      </div>
    </div>

    <!-- Video Grid -->
    <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

    <!-- Video Player Modal -->
    <div id="modal-player" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
      <div class="bg-chzzk-card border border-chzzk-border rounded-2xl max-w-4xl w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
        <div class="p-4 border-b border-chzzk-border flex items-center justify-between bg-chzzk-header">
          <h3 id="player-title" class="font-bold text-sm sm:text-base text-slate-100 truncate pr-4"></h3>
          <button onclick="closePlayer()" class="text-slate-400 hover:text-white font-bold text-lg px-2">✕</button>
        </div>
        <div class="relative w-full aspect-video bg-black">
          <iframe id="player-iframe" class="w-full h-full border-0" allowfullscreen allow="autoplay"></iframe>
        </div>
        <div class="p-4 overflow-y-auto space-y-2 bg-slate-950 border-t border-chzzk-border text-xs">
          <div class="flex items-center gap-2">
            <span id="player-category" class="px-2 py-0.5 rounded text-[10px] font-bold bg-chzzk/10 text-chzzk border border-chzzk/30"></span>
            <span id="player-date" class="text-slate-400"></span>
          </div>
          <p id="player-desc" class="text-slate-300 whitespace-pre-line leading-relaxed"></p>
        </div>
      </div>
    </div>

    <!-- Request Modal -->
    <div id="modal-request" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
      <div class="bg-chzzk-card border border-chzzk-border p-6 rounded-2xl max-w-md w-full shadow-2xl space-y-4">
        <div class="flex items-center justify-between border-b border-chzzk-border pb-3">
          <h3 class="font-bold text-sm text-chzzk flex items-center gap-2"><i class="fa-solid fa-paper-plane"></i> 시청자 요청함</h3>
          <button onclick="closeModal('request')" class="text-slate-400 hover:text-white">✕</button>
        </div>
        <form onsubmit="handleRequestSubmit(event)" class="space-y-3">
          <div>
            <label class="block text-xs text-slate-300 mb-1 font-semibold">구분</label>
            <select id="req-type" class="w-full bg-slate-950 border border-chzzk-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-chzzk"></select>
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1 font-semibold">닉네임 (선택)</label>
            <input type="text" id="req-author" placeholder="익명 가능" class="w-full bg-slate-950 border border-chzzk-border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-chzzk">
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1 font-semibold">내용</label>
            <textarea id="req-content" rows="4" placeholder="내용을 자세히 작성해주세요." required class="w-full bg-slate-950 border border-chzzk-border rounded-xl p-3 text-xs text-white focus:outline-none focus:border-chzzk leading-relaxed"></textarea>
          </div>
          <button type="submit" class="w-full bg-chzzk hover:bg-chzzk-hover text-black font-extrabold py-2.5 rounded-xl text-xs transition-all chzzk-glow">요청 보내기</button>
        </form>
      </div>
    </div>

    <!-- Notice Modal -->
    <div id="modal-notice" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
      <div class="bg-chzzk-card border border-chzzk-border p-6 rounded-2xl max-w-lg w-full shadow-2xl space-y-4 max-h-[85vh] flex flex-col">
        <div class="flex items-center justify-between border-b border-chzzk-border pb-3">
          <h3 class="font-bold text-sm text-amber-400 flex items-center gap-2"><i class="fa-solid fa-bullhorn"></i> 공지사항</h3>
          <button onclick="closeModal('notice')" class="text-slate-400 hover:text-white">✕</button>
        </div>
        <div id="notice-list" class="overflow-y-auto space-y-3 pr-1 flex-1"></div>
      </div>
    </div>

  </main>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDo0Cp5rBuDCnZJxDhPPOgzr0FF5IxY0f8",
      authDomain: "btjm-a4a4f.firebaseapp.com",
      projectId: "btjm-a4a4f",
      storageBucket: "btjm-a4a4f.firebasestorage.app",
      messagingSenderId: "704186478589",
      appId: "1:704186478589:web:71fe40c543ce3980ceb394"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let state = {
      videos: [],
      categories: ['전체', '저쳇', '게임', '음악', '합방', '기타'],
      requestTypes: ['영상 누락/오류 신고', '타임라인 제보', '건의사항'],
      notices: [],
      settings: { siteTitle: '보젬 다시보기', streamerName: '치지직 방송 아카이브' },
      selectedCategory: '전체'
    };

    onSnapshot(doc(db, "archive", "mainData"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        state.videos = data.videos || [];
        state.categories = ['전체', ...(data.categories || ['저쳇', '게임', '음악', '합방', '기타'])];
        state.requestTypes = data.requestTypes || ['영상 누락/오류 신고', '타임라인 제보', '건의사항'];
        state.notices = data.notices || [];
        state.settings = data.settings || state.settings;
        renderAll();
      }
    });

    window.handleRequestSubmit = async function(e) {
      e.preventDefault();
      const type = document.getElementById('req-type').value;
      const author = document.getElementById('req-author').value.trim() || '익명';
      const content = document.getElementById('req-content').value.trim();

      try {
        await addDoc(collection(db, "requests"), {
          type, author, content,
          date: new Date().toISOString().split('T')[0],
          status: '대기중',
          createdAt: Date.now()
        });
        alert('요청이 제출되었습니다. 감사합니다!');
        document.getElementById('req-content').value = '';
        closeModal('request');
      } catch (err) {
        alert('요청 제출 중 오류가 발생했습니다.');
      }
    };

    function renderAll() {
      document.getElementById('site-title').textContent = state.settings.siteTitle || '보젬 다시보기';
      document.getElementById('streamer-name').textContent = state.settings.streamerName || '치지직 방송 아카이브';
      document.title = state.settings.siteTitle || '보젬 다시보기';

      const bannerNotice = state.notices.find(n => n.asBanner);
      const topBanner = document.getElementById('top-banner');
      if (bannerNotice) {
        document.getElementById('top-banner-text').textContent = `📢 [공지] ${bannerNotice.title}`;
        topBanner.classList.remove('hidden');
      } else {
        topBanner.classList.add('hidden');
      }

      // 카테고리 바
      const catBar = document.getElementById('category-bar');
      catBar.innerHTML = state.categories.map(c => `
        <button onclick="setCategory('${c}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${state.selectedCategory === c ? 'bg-chzzk text-black shadow-md chzzk-glow' : 'text-slate-400 hover:text-white bg-chzzk-card/60 border border-chzzk-border/50'}">
          ${c}
        </button>
      `).join('');

      // 시청자 요청 구단 셀렉트박스 동적 렌더링
      const reqSelect = document.getElementById('req-type');
      if (reqSelect) {
        reqSelect.innerHTML = state.requestTypes.map(rt => `<option value="${rt}">${rt}</option>`).join('');
      }

      renderVideos();

      const noticeList = document.getElementById('notice-list');
      if (state.notices.length === 0) {
        noticeList.innerHTML = `<p class="text-slate-500 text-xs text-center py-6">등록된 공지사항이 없습니다.</p>`;
      } else {
        noticeList.innerHTML = state.notices.map(n => `
          <div class="bg-slate-950 border border-chzzk-border p-4 rounded-xl space-y-1">
            <div class="flex items-center justify-between text-[11px] text-slate-400">
              <span>${n.date}</span>
              ${n.asBanner ? `<span class="px-2 py-0.5 rounded text-[10px] font-extrabold bg-chzzk text-black">띠배너</span>` : ''}
            </div>
            <h4 class="font-bold text-xs sm:text-sm text-chzzk">${n.title}</h4>
            <p class="text-xs text-slate-300 whitespace-pre-line leading-relaxed pt-1">${n.desc}</p>
          </div>
        `).join('');
      }
    }

    window.setCategory = function(cat) {
      state.selectedCategory = cat;
      renderAll();
    };

    window.renderVideos = function() {
      const grid = document.getElementById('video-grid');
      const search = document.getElementById('search-input').value.trim().toLowerCase();
      let filtered = state.videos;

      if (state.selectedCategory !== '전체') {
        filtered = filtered.filter(v => v.category === state.selectedCategory);
      }
      if (search) {
        filtered = filtered.filter(v => v.title.toLowerCase().includes(search) || v.category.toLowerCase().includes(search));
      }

      document.getElementById('video-count').textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full bg-chzzk-card border border-chzzk-border p-12 rounded-2xl text-center text-slate-500 text-xs">등록된 다시보기 영상이 없습니다.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(v => {
        const yId = extractYoutubeId(v.url);
        const thumb = yId ? `https://img.youtube.com/vi/${yId}/hqdefault.jpg` : 'https://via.placeholder.com/480x270/121824/00ffa3?text=NO+THUMBNAIL';
        return `
          <div onclick="playVideo('${v.title.replace(/'/g, "\\'")}', '${v.url}', '${v.category}', '${v.date}', \`${(v.desc || '').replace(/`/g, "\\`")}\`)" class="bg-chzzk-card border border-chzzk-border rounded-2xl overflow-hidden shadow-lg hover:border-chzzk/60 transition-all cursor-pointer group flex flex-col">
            <div class="relative aspect-video overflow-hidden bg-slate-950">
              <img src="${thumb}" alt="${v.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
              <div class="absolute inset-0 bg-black/40 group-hover:bg-black/10 transition-colors flex items-center justify-center">
                <div class="w-12 h-12 rounded-full bg-chzzk/90 text-black flex items-center justify-center text-lg shadow-xl group-hover:scale-110 transition-transform">
                  <i class="fa-solid fa-play ml-1"></i>
                </div>
              </div>
              ${v.pinned ? `<span class="absolute top-2 left-2 bg-amber-500 text-black text-[10px] font-black px-2 py-0.5 rounded shadow"><i class="fa-solid fa-thumbtack mr-1"></i>고정</span>` : ''}
              <span class="absolute bottom-2 right-2 bg-black/80 text-slate-300 text-[10px] px-2 py-0.5 rounded font-mono">${v.date}</span>
            </div>
            <div class="p-4 flex-1 flex flex-col justify-between space-y-2">
              <div>
                <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-chzzk/10 text-chzzk border border-chzzk/30 mb-1.5">[${v.category}]</span>
                <h3 class="font-bold text-xs sm:text-sm text-slate-100 group-hover:text-chzzk transition-colors line-clamp-2">${v.title}</h3>
              </div>
            </div>
          </div>
        `;
      }).join('');
    };

    function extractYoutubeId(url) {
      if(!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    window.playVideo = function(title, url, cat, date, desc) {
      const yId = extractYoutubeId(url);
      if(!yId) { alert('유튜브 URL 형식이 올바르지 않습니다.'); return; }
      document.getElementById('player-title').textContent = title;
      document.getElementById('player-category').textContent = `[${cat}]`;
      document.getElementById('player-date').textContent = date;
      document.getElementById('player-desc').textContent = desc || '등록된 내용이 없습니다.';
      document.getElementById('player-iframe').src = `https://www.youtube.com/embed/${yId}?autoplay=1`;
      document.getElementById('modal-player').classList.remove('hidden');
    };

    window.closePlayer = function() {
      document.getElementById('player-iframe').src = '';
      document.getElementById('modal-player').classList.add('hidden');
    };

    window.openModal = function(id) { document.getElementById(`modal-${id}`).classList.remove('hidden'); };
    window.closeModal = function(id) { document.getElementById(`modal-${id}`).classList.add('hidden'); };
    window.closeBanner = function() { document.getElementById('top-banner').classList.add('hidden'); };
  </script>
</body>
</html>
